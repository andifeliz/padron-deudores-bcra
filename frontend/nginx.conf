# Sirve la app y reenvía /api a las dos APIs: el navegador habla con un solo origen, así no hace falta CORS.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    location /api/importador/ {
        proxy_pass http://importador-api:8080/;
        # La subida del archivo real (~5,5 GB) pasa a la API a medida que llega, sin guardarse antes en nginx.
        client_max_body_size 8g;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
    }

    location /api/consulta/ {
        proxy_pass http://consulta-api:8080/;
    }

    # Cualquier otra ruta es la app.
    location / {
        try_files $uri /index.html;
    }
}
